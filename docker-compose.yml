version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: topplate_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-topplate_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-topplate_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-topplate_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topplate_admin -d topplate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topplate_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-topplate_admin}:${POSTGRES_PASSWORD:-topplate_secret_password}@postgres:5432/${POSTGRES_DB:-topplate_db}?schema=public
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-topplate_super_secret_jwt_key_32_chars_min_len}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: topplate_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  postgres_data:
